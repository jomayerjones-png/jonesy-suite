name: Deploy to GitHub Pages

on:
  push:
    branches: ['main', 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            apps/jonesy-suite/package-lock.json
            apps/life-suite/package-lock.json
            apps/prof-g-suite/package-lock.json
            apps/status-suite/package-lock.json
            apps/kaleidoscope-suite/package-lock.json

      - name: Build jonesy-suite
        working-directory: apps/jonesy-suite
        env:
          VITE_SUPABASE_URL: ${{ secrets.JONESY_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.JONESY_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.JONESY_GOOGLE_CLIENT_ID }}
        run: npm ci && npm run build

      - name: Build life-suite
        working-directory: apps/life-suite
        run: npm ci && npm run build

      - name: Build prof-g-suite
        working-directory: apps/prof-g-suite
        run: npm ci && npm run build

      - name: Build status-suite
        working-directory: apps/status-suite
        run: npm ci && npm run build

      - name: Build kaleidoscope-suite
        working-directory: apps/kaleidoscope-suite
        run: npm ci && npm run build

      - name: Merge build outputs
        run: |
          mkdir -p deploy/life-suite
          mkdir -p deploy/prof-g-suite
          mkdir -p deploy/status-suite
          mkdir -p deploy/kaleidoscope-suite
          cp -r apps/jonesy-suite/dist/. deploy/
          cp -r apps/life-suite/dist/. deploy/life-suite/
          cp -r apps/prof-g-suite/dist/. deploy/prof-g-suite/
          cp -r apps/status-suite/dist/. deploy/status-suite/
          cp -r apps/kaleidoscope-suite/dist/. deploy/kaleidoscope-suite/

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - id: deploy
        uses: actions/deploy-pages@v4
