name: Deploy to GitHub Pages

on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            apps/jonesy-suite/package-lock.json
            apps/life-suite/package-lock.json

      - name: Build jonesy-suite
        working-directory: apps/jonesy-suite
        run: npm ci && npm run build

      - name: Build life-suite
        working-directory: apps/life-suite
        run: npm ci && npm run build

      - name: Merge build outputs
        run: |
          mkdir -p deploy/life-suite
          cp -r apps/jonesy-suite/dist/. deploy/
          cp -r apps/life-suite/dist/. deploy/life-suite/

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - id: deploy
        uses: actions/deploy-pages@v4
