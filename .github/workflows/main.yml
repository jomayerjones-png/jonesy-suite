name: Daily Prospect Briefing
on:
  schedule:
    - cron: '0 13 * * 1-5'   # 8am EST Mon–Fri
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
        working-directory: scripts
      - run: node scripts/daily-prospects.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LIFE_SUPABASE_SERVICE_KEY: ${{ secrets.LIFE_SUPABASE_SERVICE_KEY }}
